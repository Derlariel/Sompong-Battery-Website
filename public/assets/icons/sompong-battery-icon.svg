<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2FA3"/>
      <stop offset="1" stop-color="#14166B"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD54A"/>
      <stop offset="1" stop-color="#FFB800"/>
    </linearGradient>
  </defs>

  <!-- rounded square badge -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#4247C9" stroke-width="4" opacity="0.5"/>

  <!-- car silhouette, simplified, sitting low -->
  <g fill="none" stroke="#7A7EDB" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M96 322 L120 322 L146 268 C158 250 178 240 200 240 L320 240 C342 240 362 250 374 268 L400 322 L424 322"/>
    <path d="M120 322 L400 322"/>
    <circle cx="168" cy="322" r="26" fill="#14166B" stroke="#7A7EDB" stroke-width="9"/>
    <circle cx="352" cy="322" r="26" fill="#14166B" stroke="#7A7EDB" stroke-width="9"/>
  </g>

  <!-- battery body -->
  <g>
    <rect x="176" y="150" width="160" height="128" rx="14" fill="#F4F6FF"/>
    <rect x="176" y="150" width="160" height="128" rx="14" fill="none" stroke="#14166B" stroke-width="6"/>
    <!-- terminals -->
    <rect x="206" y="132" width="26" height="24" rx="4" fill="#F4F6FF"/>
    <rect x="280" y="132" width="26" height="24" rx="4" fill="#F4F6FF"/>
    <!-- terminal marks -->
    <text x="219" y="196" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#14166B" text-anchor="middle">+</text>
    <text x="293" y="194" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#14166B" text-anchor="middle">−</text>
  </g>

  <!-- bolt overlay across battery -->
  <path d="M270 138 L204 236 L246 236 L228 306 L318 200 L268 200 Z" fill="url(#bolt)" stroke="#8A5B00" stroke-width="4" stroke-linejoin="round"/>
</svg>
